name: Bindings Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check-bindings:
    name: Check Go Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.24'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0

      - name: Build contracts
        run: forge build --no-metadata

      - name: Generate bindings
        run: make bindings

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain pkg/bindings/)" ]; then
            echo "❌ Bindings are out of date. Please run 'make bindings' and commit the changes."
            git status --porcelain pkg/bindings/
            git diff pkg/bindings/
            exit 1
          else
            echo "✅ Bindings are up to date"
          fi